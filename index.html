<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      background: white;
      width: 90%;
      max-width: 420px;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.15);
    }

    h1 {
      color: #128c7e;
    }

    p {
      color: #555;
    }

    button {
      background: #25d366;
      color: white;
      border: 0;
      padding: 14px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>WhatsApp Web</h1>
    <p>Connect your WhatsApp account to continue.</p>
    <button onclick="alert('WhatsApp connection will be added in the next step.')">
      Connect WhatsApp
    </button>
  </div>
</body>
</html>
